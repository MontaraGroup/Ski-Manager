plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
ext.signingValue = { String name -> System.getenv(name) ?: localProperties.getProperty(name) }

android {
    namespace 'net.skimanager.app'
    compileSdk 37

    defaultConfig {
        applicationId "net.skimanager.app"
        minSdk 26
        targetSdk 36
        versionCode VERSION_CODE as Integer
        versionName VERSION_NAME

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    // Signing values live outside the repo: android/local.properties locally, environment variables in CI
    signingConfigs {
        release {
            def keystorePath = signingValue("SKI_KEYSTORE_PATH")
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword signingValue("SKI_KEYSTORE_PASSWORD")
                keyAlias signingValue("SKI_KEY_ALIAS")
                keyPassword signingValue("SKI_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            buildConfigField "String", "BASE_URL", '"https://staging.ski-manager.net"'
        }
        release {
            // -PreleaseBaseUrl lets a test build run the shrunk code against staging
            buildConfigField "String", "BASE_URL", "\"${findProperty('releaseBaseUrl') ?: 'https://ski-manager.net'}\""
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }


    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    // Expressive isn't in a stable release yet, so this overrides the BOM's 1.4.0
    implementation 'androidx.compose.material3:material3:1.5.0-rc01'
    implementation 'androidx.compose.material:material-icons-extended'

    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4'
    implementation 'androidx.navigation:navigation-compose:2.9.5'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.13.2'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
