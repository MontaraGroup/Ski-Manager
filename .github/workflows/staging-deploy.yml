name: Deploy to Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Lint & Pre-Deploy Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, json, curl, mysqli
          coverage: none

      - name: Validate PHP Syntax
        run: |
          ERRORS=0
          while IFS= read -r file; do
            if ! php -l "$file" > /dev/null 2>&1; then
              echo "Syntax Error in: $file"
              php -l "$file"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find app -type f -name "*.php")
          if [ "$ERRORS" -gt 0 ]; then exit 1; fi

  deploy-staging:
    name: Deploy to Staging Server
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # public/build and style.css are not in git: build them here and upload them, so the
      # 1-CPU server never builds and every deploy ships the bundle that matches its code
      - name: Build assets
        run: |
          npm ci
          npm run build
          test -f public/build/.vite/manifest.json
          tar -czf "$RUNNER_TEMP/assets.tgz" public/build public/css/style.css

      - name: Upload assets to the server
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          SSH_HOST: ${{ secrets.PROD_HOST }}
          SSH_USER: ${{ secrets.PROD_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$RUNNER_TEMP/assets.tgz" "$SSH_USER@$SSH_HOST:/tmp/ski-assets-${{ github.sha }}.tgz"
          rm -f ~/.ssh/deploy_key

      - name: Execute Staging Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            TARGET_DIR="/srv/ski-manager/sites/skiv2-staging/ci4"
            if [ -n "${{ secrets.STAGING_PATH }}" ]; then
              TARGET_DIR="${{ secrets.STAGING_PATH }}"
            fi

            echo "Navigating to staging directory: ${TARGET_DIR}"
            cd "${TARGET_DIR}"

            git fetch origin staging
            git reset --hard origin/staging
            bash scripts/install-assets.sh /tmp/ski-assets-${{ github.sha }}.tgz "$(pwd)"
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh staging

      - name: Verify Staging Smoke Test
        run: |
          echo "Verifying live staging endpoint..."
          sleep 3
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          CODE=$(curl -k -s -A "$UA" -o /dev/null -w "%{http_code}" https://staging.ski-manager.net/health || echo "000")
          echo "Staging Health Check HTTP response code: $CODE"
          if [ "$CODE" = "200" ]; then
            echo "Staging is healthy and returning HTTP 200."
          else
            echo "Notice: Cloudflare/CDN returned HTTP $CODE for runner IP. Internal health check on VPS passed during deploy."
          fi
