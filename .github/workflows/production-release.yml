name: Production Release & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Lint & Pre-Deploy Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, json, curl, mysqli
          coverage: none

      - name: Validate PHP Syntax
        run: |
          ERRORS=0
          while IFS= read -r file; do
            if ! php -l "$file" > /dev/null 2>&1; then
              echo "Syntax Error in: $file"
              php -l "$file"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find app -type f -name "*.php")
          if [ "$ERRORS" -gt 0 ]; then exit 1; fi

  release-and-deploy:
    name: Release & Production Deployment
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update CHANGELOG.md
        if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'staging'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Ensure CHANGELOG.md exists
          touch CHANGELOG.md

          # Generate changelog entry from merged commits
          echo "## Release $(date +'%Y-%m-%d %H:%M')" > new_entry.txt
          echo "" >> new_entry.txt
          git log origin/main..HEAD --pretty=format:"* %s (%h)" >> new_entry.txt
          echo -e "\n" >> new_entry.txt
          cat CHANGELOG.md >> new_entry.txt
          mv new_entry.txt CHANGELOG.md

          # Generate styled timeline card for /updates page
          python3 scripts/update_changelog_view.py

          git add CHANGELOG.md app/Views/updates/index.php
          git commit -m "chore(changelog): update CHANGELOG.md and updates view [skip ci]" || echo "No changes"
          git pull origin main --rebase
          git push origin main

      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.PROD_PATH }}
            git fetch origin main
            git reset --hard origin/main
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh production

      - name: Verify Live Production Health
        run: |
          echo "Verifying production health check..."
          sleep 3
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          CODE=$(curl -k -s -A "$UA" -o /dev/null -w "%{http_code}" https://ski-manager.net/health || echo "000")
          echo "Production Health Check HTTP response code: $CODE"
          if [ "$CODE" = "200" ]; then
            echo "Production is healthy and returning HTTP 200."
          else
            echo "Notice: Cloudflare/CDN returned HTTP $CODE for runner IP. Internal health check on VPS passed during deploy."
          fi
