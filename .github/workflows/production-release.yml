name: Production Release & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Lint & Pre-Deploy Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, json, curl, mysqli
          coverage: none

      - name: Validate PHP Syntax
        run: |
          ERRORS=0
          while IFS= read -r file; do
            if ! php -l "$file" > /dev/null 2>&1; then
              echo "Syntax Error in: $file"
              php -l "$file"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find app -type f -name "*.php")
          if [ "$ERRORS" -gt 0 ]; then exit 1; fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # The server serves the committed public/build (no Node on the VPS), so a stale build
      # must stop the deploy rather than ship old islands
      - name: Build React islands and check the committed build is current
        run: |
          npm ci
          npm run build:islands
          if ! git diff --quiet -- public/build; then
            echo "public/build is out of date: run npm run build:islands and commit the result"
            git status --short -- public/build
            exit 1
          fi

  release-and-deploy:
    name: Release & Production Deployment
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update CHANGELOG.md
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          touch CHANGELOG.md
          echo "## Release $(date +'%Y-%m-%d %H:%M')" > new_entry.txt
          echo "" >> new_entry.txt
          git log -n 5 --pretty=format:"* %s (%h)" >> new_entry.txt
          echo -e "\n" >> new_entry.txt
          cat CHANGELOG.md >> new_entry.txt
          mv new_entry.txt CHANGELOG.md

          if [ -f "scripts/update_changelog_view.py" ]; then
            python3 scripts/update_changelog_view.py || true
          fi

          git add CHANGELOG.md app/Views/updates/index.php app/Views/updates/updates.json 2>/dev/null || true
          git commit -m "chore(changelog): update CHANGELOG.md and updates view [skip ci]" || echo "No changes"
          git push origin main || echo "Changelog push skipped"

      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.PROD_PATH }}
            git fetch origin main
            git reset --hard origin/main
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh production

      - name: Verify Live Production Health
        run: |
          echo "Verifying production health check..."
          sleep 3
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          CODE=$(curl -k -s -A "$UA" -o /dev/null -w "%{http_code}" https://ski-manager.net/health || echo "000")
          echo "Production Health Check HTTP response code: $CODE"
          if [ "$CODE" = "200" ]; then
            echo "Production is healthy and returning HTTP 200."
          else
            echo "Notice: Cloudflare/CDN returned HTTP $CODE for runner IP. Internal health check on VPS passed during deploy."
          fi
