name: Build Ski Manager Android Bundle

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

jobs:
  build-bundle:
    name: Compile & Package Android Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK Components
        run: |
          echo "ANDROID_HOME is $ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37" "build-tools;37.0.0" || true

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Restore Upload Key
        env:
          SKI_KEYSTORE_BASE64: ${{ secrets.SKI_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SKI_KEYSTORE_BASE64" ]; then
            echo "::error::Add the SKI_KEYSTORE_BASE64 secret. See android/README.md."
            exit 1
          fi
          echo "$SKI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build Release Bundle
        working-directory: android
        env:
          SKI_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          SKI_KEYSTORE_PASSWORD: ${{ secrets.SKI_KEYSTORE_PASSWORD }}
          SKI_KEY_ALIAS: ${{ secrets.SKI_KEY_ALIAS }}
          SKI_KEY_PASSWORD: ${{ secrets.SKI_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Remove Upload Key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Upload Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkiManager-Android-Bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
